<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title | default .Site.Title }}</title>
    <meta name="description" content="{{ .Description | default .Site.Params.description }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    {{ partial "head.html" . }}
</head>
<body>
    {{ partial "header.html" . }}
    <script>/* 暗色用户首帧就纠正按钮文案，别等页尾脚本 */(function(){try{var d=document.documentElement.getAttribute('data-theme')==='dark';document.querySelectorAll('[data-theme-btn]').forEach(function(b){b.textContent=d?'☀ LIGHT':'☾ DARK';});}catch(e){}})();</script>
    {{ block "main" . }}{{ end }}
    {{ partial "footer.html" . }}
    {{ partial "scripts.html" . }}
</body>
</html>
